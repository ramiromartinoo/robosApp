server:
  # los hostings suelen indicar el puerto con la variable PORT; en la PC queda el 8080 de siempre
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # solo el chequeo de salud: el resto de los endpoints de actuator expone datos internos
        include: health
  endpoint:
    health:
      # responde solo {"status":"UP"}, sin detalles de la base ni del disco
      show-details: never

spring:
  config:
    # Secretos locales (no se commitea). Ver application-local.yaml.example
    import: optional:classpath:application-local.yaml
  datasource:
    # el puerto por defecto es el 3307; con otro, definir DB_URL en application-local.yaml
    url: ${DB_URL:jdbc:mysql://localhost:3307/robosapp_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Las tablas las crea y modifica Flyway (src/main/resources/db/migration).
      # Hibernate solo verifica al arrancar que coincidan con las entidades: si no, la app no levanta.
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Una base que ya existía de antes de Flyway (creada por Hibernate) se marca como versión 1
    # sin tocarla. Una base vacía se crea completa con las migraciones.
    baseline-on-migrate: true
    baseline-version: 1

robosapp:
  seguridad:
    # true SOLO en desarrollo (se activa en application-local.yaml): habilita los tokens y usuarios de prueba
    tokens-de-prueba: false
  posteos:
    # límite de publicaciones por usuario
    maximo-por-hora: 5
    # ventana para editar un posteo propio después de publicarlo
    minutos-para-editar: 10
  denuncias:
    # con esta cantidad de denuncias pendientes el posteo pasa a EN_REVISION y sale del feed
    umbral-auto-ocultamiento: 5
  reputacion:
    # una cuenta es "nueva" mientras tenga menos de estos días o menos de estos reportes vigentes
    dias-de-cuenta-nueva: 7
    reportes-minimos: 3
    # puntos (confirmaciones recibidas menos negaciones y sanciones) para ser "confiable"
    puntos-para-confiable: 10
